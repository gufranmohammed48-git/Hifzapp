# nginx config for the Hifzapp monorepo deployment.
#
# This file lives in deploy/nginx.conf in the Hifzapp repo. It is
# deployed to /etc/nginx/sites-available/hifzapp on the DO droplet.
#
# Layout (HTTP - port 80):
#   /healthz    →  proxy to FastConformer container
#   /ws         →  proxy to FastConformer container (WebSocket, 24h timeout)
#   /api/       →  proxy to FastConformer container (REST debug endpoints)
#   /*          →  serve static files from /opt/quran/web/
#
# For HTTPS, add a parallel server block on port 443 with SSL settings
# and a self-signed cert (or use cloudflared for real HTTPS — recommended).

server {
    listen 80 default_server;
    server_name _;

    # Health check
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket endpoint for FastConformer streaming
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API endpoints (debug audio, etc.)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve static frontend (hafizAssist_streaming.html + phonemes-data.js)
    location / {
        root /opt/quran/web;
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS server block (self-signed cert by default, cloudflared tunnel
# for real certs). Both blocks have the same proxy rules.
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Health check
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static frontend
    location / {
        root /opt/quran/web;
        try_files $uri $uri/ /index.html;
    }
}
