# docker-compose.yml — Streaming FastConformer Quran ASR
#
# Mounts the local model directory from the host into the container.
# Set MODEL_HOST_PATH in backend/.env (see backend/.env.example).
#
# Required files in MODEL_HOST_PATH (mounted as /data):
#   - model_streaming_with_encoder.q8.onnx  (the int8 streaming model)
#   - streaming_global_cmvn.npz             (CMVN feature stats)
#   - tokenizer.model                       (SentencePiece tokenizer)
#   - config.json                           (optional, model config)

services:
  fastconformer-quran:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: fastconformer-quran:local
    container_name: fastconformer-quran
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${MODEL_HOST_PATH:-./model}:/data:ro
    environment:
      - MODEL_PATH=/data/model_streaming_with_encoder.q8.onnx
      - TOKENIZER_PATH=/data/tokenizer.model
      - CMVN_PATH=/data/streaming_global_cmvn.npz
      - CMVN_VARIANT=${CMVN_VARIANT:-clean}
      - NUM_THREADS=${NUM_THREADS:-2}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
