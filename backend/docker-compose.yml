# docker-compose.yml — Zipformer Quran ASR
#
# Mounts the local model directory from the host into the container.
# Set MODEL_HOST_PATH in backend/.env (see backend/.env.example).

services:
  zipformer-quran:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: zipformer-quran:local
    container_name: zipformer-quran
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Mount the model directory (read-only). The container expects
      # the model file + tokens.txt to live directly in this dir.
      - ${MODEL_HOST_PATH:-./model}:/data:ro
    environment:
      - MODEL_PATH=/data/quran_phoneme_zipformer.int8.onnx
      - TOKENS_PATH=/data/tokens.txt
      - NUM_THREADS=${NUM_THREADS:-2}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
