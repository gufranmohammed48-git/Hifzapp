# docker-compose.yml — Hifzapp ASR (int8 ONNX FastConformer)
#
# Mounts the local model directory from the host into the container.
# Set MODEL_HOST_PATH in backend/.env (see backend/.env.example).
#
# Required files in MODEL_HOST_PATH (mounted as /data):
#   - model_with_encoder.q8.onnx  (the int8 model with audio preprocessing)
#   - tokenizer.model             (SentencePiece tokenizer)

services:
  fastconformer-int8:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: fastconformer-int8:local
    container_name: fastconformer-int8
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ${MODEL_HOST_PATH:-./model}:/data:ro
    environment:
      - MODEL_PATH=/data/model_with_encoder.q8.onnx
      - TOKENIZER_PATH=/data/tokenizer.model
      - NUM_THREADS=${NUM_THREADS:-2}
      - WINDOW_SEC=${WINDOW_SEC:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3).read()\" || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
